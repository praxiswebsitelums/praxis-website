<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore research conducted by Praxis Initiative at LUMS, examining real-world questions through student-led research, lived experiences and dialogue.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://praxis.lums.edu.pk/research.html">
  <meta property="og:site_name" content="Praxis Initiative">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Research | Praxis Initiative at LUMS">
  <meta property="og:description" content="Explore research conducted by Praxis Initiative at LUMS, examining real-world questions through student-led research, lived experiences and dialogue.">
  <meta property="og:url" content="https://praxis.lums.edu.pk/research.html">
  <meta property="og:image" content="https://praxis.lums.edu.pk/images/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Research | Praxis Initiative at LUMS">
  <meta name="twitter:description" content="Explore research conducted by Praxis Initiative at LUMS, examining real-world questions through student-led research, lived experiences and dialogue.">
  <meta name="twitter:image" content="https://praxis.lums.edu.pk/images/og-image.jpg">
  <title>Research | Praxis Initiative at LUMS</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/research.css">
  <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>

<div data-site-header></div>

<main class="ab3 research-page">

  
  <section class="research-archive on-dark">
    <div class="watermark" id="researchArchiveMark" aria-hidden="true">PRAXIS</div>

    <div class="wrap">
      <div class="eyebrow rv" data-research-eyebrow>01 / OUR RESEARCH</div>

      <h1 class="mask">
        <span data-research-heading>Research that asks something of us.</span>
      </h1>

      <p class="research-archive-intro rv d1" data-research-intro>
        Explore the questions Praxis has investigated. Each project begins with a question,
        develops through research, and ends by opening the door to further conversation.
      </p>

      
      <div class="research-grid" data-research-grid></div>
    </div>
  </section>

  
  <div class="research-modal-overlay" data-modal-overlay>
    <div
      class="research-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="researchModalTitle"
      data-modal
    >
      <button
        type="button"
        class="research-modal-close"
        data-modal-close
        aria-label="Close research details"
      >×</button>

      <div class="research-modal-media">
        <img data-modal-image src="" alt="">
      </div>

      <div class="research-modal-meta" data-modal-meta></div>

      <h2 class="research-modal-title" id="researchModalTitle" data-modal-title></h2>

      <p class="research-modal-desc" data-modal-desc></p>

      <a
        class="research-modal-pdf"
        data-modal-pdf
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        hidden
      >Download PDF ↗</a>
    </div>
  </div>

</main>

<div data-site-footer></div>

<script src="data/site.js"></script>
<script src="js/main.js"></script>
<script src="js/research.js"></script>

</body>
</html>
